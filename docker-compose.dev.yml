services:
  retrobite-web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: web-dev
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./web:/app/web
      - ./games:/games
      - retrobite-data:/data
    restart: always

  retrobite-share:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: share
    env_file:
      - .env
    # network_mode: host
    volumes:
      - ./games:/storage/games
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - "139:139"     # SMB
      - "446:445"     # SMB
      - "20:20"       # FTP data
      - "21:21"       # FTP control
      - "21100-21110:21100-21110"  # FTP passive
    restart: always

volumes:
  retrobite-data:
