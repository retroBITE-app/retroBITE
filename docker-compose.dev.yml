# Its own project, so bringing this up does not replace the production
# stack's containers: both files name a service retrobite-db, and without
# this they fight over the same container.
name: retrobite-dev

services:
  retrobite-web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: web-dev
    # supervisord stops its programs one after another, each worker finishing
    # cleanly, about a second apiece: past Docker's default ten seconds the
    # rest would be killed mid-job.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: retrobite-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-retrobite}
      DB_USERNAME: ${DB_USERNAME:-retrobite}
      DB_PASSWORD: ${DB_PASSWORD:-retrobite}
      # Transfers write to a drive from the browser, which Chrome allows only
      # on https or localhost; a page opened another way links here. The same
      # port as published below.
      TRANSFER_LOCALHOST_URL: ${TRANSFER_LOCALHOST_URL:-http://localhost:82}
      # nginx is in front, so game files and artwork are sent by it rather
      # than streamed by PHP (App\Support\NginxFile).
      SERVE_WITH_NGINX: "true"
    ports:
      - 82:80
      # Vite. Fixed by vite.config.js with strictPort, so a clash fails loudly.
      - 1337:1337
    volumes:
      - .:/app
      - ${GAMES_PATH:-./games}:/app/storage/app/games
      # Explicit despite the .:/app bind above, so DOCS_PATH can point outside
      # the repository.
      - ${DOCS_PATH:-./storage/app/docs}:/app/storage/app/docs
      - retrobite-media:/app/storage/app/media
      # Livewire compiles single-file components to absolute paths, so sharing
      # this directory between host and container invalidates every cached view.
      - retrobite-views:/app/storage/framework/views
      # The container's own node_modules. package.json pins linux-x64-gnu
      # binaries and Alpine is musl, so sharing the host's tree through the
      # bind mount above hands Vite libraries it cannot load.
      - retrobite-node:/app/node_modules
    depends_on:
      retrobite-db:
        condition: service_healthy
    restart: always

  retrobite-db:
    image: mariadb:11.4
    container_name: retrobite-db-dev
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-retrobite}
      MARIADB_USER: ${DB_USERNAME:-retrobite}
      MARIADB_PASSWORD: ${DB_PASSWORD:-retrobite}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-retrobite}
    volumes:
      - retrobite-db:/var/lib/mysql
    ports:
      # Published in development so a GUI client or a host-side `php artisan`
      # can reach it. The production compose keeps it on the internal network.
      - "${DB_PORT_HOST:-3308}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always

  retrobite-share:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: share
    env_file:
      - .env
    network_mode: host
    volumes:
      - ${GAMES_PATH:-./games}:/games
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    init: true
    restart: always

volumes:
  retrobite-db:
  retrobite-media:
  retrobite-views:
  retrobite-node:
