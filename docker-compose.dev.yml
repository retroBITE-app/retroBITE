services:
  retrobite-web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: web-dev
    env_file:
      - .env
    environment:
      DB_DATABASE: /data/database.sqlite
    ports:
      - 81:80
    volumes:
      - .:/app
      - ${GAMES_PATH:-./games}:/app/storage/app/games
      # Compiled Blade must NOT be shared with the host. Livewire compiles each
      # single-file component to storage/framework/views/livewire/views/<hash>
      # and embeds an absolute path — /app here, /home/... on the host. With the
      # repo bind-mounted, whichever side compiled last makes the other 500 with
      # "filemtime(): stat failed".
      - retrobite-views:/app/storage/framework/views
      - retrobite-data:/data
    restart: always

  retrobite-share:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: share
    env_file:
      - .env
    network_mode: host
    volumes:
      - ${GAMES_PATH:-./games}:/games
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # Reaps zombies and forwards signals as PID 1, so the entrypoint's supervisor
    # does not have to.
    init: true
    # No `ports:` — host networking publishes 139, 445, 20, 21 and the passive
    # range 21100-21110 directly. Docker ignores port mappings under host mode,
    # so listing them here only misleads.
    restart: always

volumes:
  retrobite-data:
  retrobite-views:
