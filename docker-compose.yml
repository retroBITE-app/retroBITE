services:
  retrobite-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: retrobite-web
    env_file:
      - .env
    environment:
      DB_DATABASE: /data/database.sqlite
    ports:
      - "81:80"
    volumes:
      - ${GAMES_PATH:-./games}:/app/storage/app/games
      - ${DOCS_PATH:-./storage/app/docs}:/app/storage/app/docs
      - retrobite-data:/data
    restart: on-failure

  retrobite-share:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retrobite-share
    env_file:
      - .env
    restart: on-failure
    network_mode: host
    volumes:
      - ${GAMES_PATH:-./games}:/games
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # Reaps zombies and forwards signals as PID 1, so the entrypoint's supervisor
    # does not have to.
    init: true
    # Optional: if you prefer bridge network instead of host, drop
    # network_mode above and uncomment these.
    # ports:
    #   - "139:139"     # SMB
    #   - "445:445"     # SMB
    #   - "20:20"       # FTP data
    #   - "21:21"       # FTP control
    #   - "21100-21110:21100-21110"  # FTP passive ports

volumes:
  retrobite-data:
