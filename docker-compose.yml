services:
  retrobite-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: retrobite-web
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./games:/games
      - retrobite-data:/data
    restart: on-failure

  retrobite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retrobite
    env_file:
      - .env
    restart: on-failure
    network_mode: host
    volumes:
      - ./games:/storage/games
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

volumes:
  retrobite-data:

    # Optional: if you prefer bridge network instead of host
    # ports:
    #   - "139:139"     # SMB
    #   - "445:445"     # SMB
    #   - "20:20"       # FTP data
    #   - "21:21"       # FTP control
    #   - "21100-21110:21100-21110"  # FTP passive ports
