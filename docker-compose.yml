services:
  retrobite-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: retrobite-web
    env_file:
      - .env
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: retrobite-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-retrobite}
      DB_USERNAME: ${DB_USERNAME:-retrobite}
      DB_PASSWORD: ${DB_PASSWORD:-retrobite}
      # Transfers write to a drive from the browser, which Chrome allows only
      # on https or localhost; a page opened another way links here. The same
      # port as published below.
      TRANSFER_LOCALHOST_URL: ${TRANSFER_LOCALHOST_URL:-http://localhost:81}
    ports:
      - "81:80"
    # Settings → Destinations searches the LAN for network shares. mDNS and
    # NetBIOS cannot cross Docker's bridge; a scan of the SMB port can, on the
    # network HOST_IP in .env is on — so set HOST_IP for the search to work.
    # Copying to a share works either way.
    volumes:
      - ${GAMES_PATH:-./games}:/app/storage/app/games
      - ${DOCS_PATH:-./storage/app/docs}:/app/storage/app/docs
      # Artwork and other media retroBite downloads itself. Unlike the games
      # mount this one is written to, and it is kept out of the games tree so a
      # console browsing the share never sees it.
      - retrobite-media:/app/storage/app/media
    depends_on:
      retrobite-db:
        condition: service_healthy
    restart: on-failure

  retrobite-db:
    image: mariadb:11.4
    container_name: retrobite-mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-retrobite}
      MARIADB_USER: ${DB_USERNAME:-retrobite}
      MARIADB_PASSWORD: ${DB_PASSWORD:-retrobite}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-retrobite}
    volumes:
      - retrobite-db:/var/lib/mysql
    # Not published to the host by default: nothing outside the compose network
    # needs it, and this box sits on a LAN with consoles on it.
    expose:
      - "3306"
    healthcheck:
      # The web container's migrate races the database otherwise: the server
      # reports started long before InnoDB will accept a connection.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: on-failure

  retrobite-share:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retrobite-share
    env_file:
      - .env
    restart: on-failure
    network_mode: host
    volumes:
      - ${GAMES_PATH:-./games}:/games
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    init: true
    # Optional: if you prefer bridge network instead of host, drop
    # network_mode above and uncomment these.
    # ports:
    #   - "139:139"     # SMB
    #   - "445:445"     # SMB
    #   - "20:20"       # FTP data
    #   - "21:21"       # FTP control
    #   - "21100-21110:21100-21110"  # FTP passive ports

volumes:
  retrobite-db:
  retrobite-media:
