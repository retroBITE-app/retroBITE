name: release-files

# What a person installs from, attached to every published release:
# docker-compose.yml, docker-compose.macvlan.yml and .env.example (as
# env.example), from the
# release's own tag. The attached docker-compose.yml defaults to that release's
# own images (RETROBITE_TAG still overrides it), so the file from any release,
# pre-releases included, runs the version it came with: the way to install one
# version and stay on it. docs/installing.md and the site fetch the develop
# branch's files instead, which follow the newest pre-release.
#
# Builds nothing and touches no Docker Hub: images.yml builds and publishes the
# release's images, and refreshes the Docker Hub pages, from the same event.
# This runs in seconds.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach the compose files and settings
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/files"
          sed "s/\${RETROBITE_TAG:-develop}/\${RETROBITE_TAG:-$TAG}/" docker-compose.yml \
            > "$RUNNER_TEMP/files/docker-compose.yml"
          grep -q "RETROBITE_TAG:-$TAG}" "$RUNNER_TEMP/files/docker-compose.yml" \
            || { echo "docker-compose.yml no longer reads \${RETROBITE_TAG:-develop}." >&2; exit 1; }
          cp docker-compose.macvlan.yml "$RUNNER_TEMP/files/"
          # GitHub renames an asset that starts with a dot (default.env.example),
          # so it goes up as env.example; save it as .env.
          cp .env.example "$RUNNER_TEMP/files/env.example"

          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP"/files/docker-compose.yml \
            "$RUNNER_TEMP"/files/docker-compose.macvlan.yml \
            "$RUNNER_TEMP"/files/env.example
