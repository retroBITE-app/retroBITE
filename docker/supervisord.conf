; The share container's daemons, kept alive by supervisord.
;
; smbd, nmbd and vsftpd are here; ps3netsrv is written into
; /etc/supervisor/conf.d/ by the entrypoint when it is switched on, because
; the account it runs as and its whitelist are only known then. Every daemon
; logs to the container's output, so `docker logs` still shows all of it.
;
; A daemon that exits is started again. One that dies within startsecs of
; starting — a port already taken, a bad setting — counts as a failed start;
; supervisord waits a second longer before each retry and gives up after
; startretries, leaving it FATAL rather than spinning. `docker exec
; retrobite-share supervisorctl status` shows which.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:smbd]
command=/usr/sbin/smbd --foreground --no-process-group
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nmbd]
command=/usr/sbin/nmbd --foreground --no-process-group
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vsftpd]
command=/usr/sbin/vsftpd /etc/vsftpd.conf
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files = /etc/supervisor/conf.d/*.conf
