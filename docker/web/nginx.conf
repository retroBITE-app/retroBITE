server {
    listen 80;
    server_name _;
    root /app/web/public;
    index index.php index.html;

    client_max_body_size 64M;

    # Security headers. The CSP allows inline styles because Tailwind injects
    # them, and `connect-src` covers the Vite HMR websocket in dev.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Slim routing — pass all non-file requests through index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Hashing one game reads the whole file. A single 60 GB ISO outlasts the
        # 60s default, and the batch that holds it would 504 mid-digest.
        fastcgi_read_timeout 600;
    }

    # Deny hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
