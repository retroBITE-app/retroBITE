; Everything the web container runs, kept alive by supervisord as PID 1.
;
; nginx and PHP-FPM are here; Reverb, the scheduler and the queue workers are
; written into /etc/supervisor.d/ by the entrypoint when the container starts,
; because how many workers, as whom and with which flags is only known then
; (queue-workers.sh, reverb.sh). Every program logs to the container's output,
; as they did before, so `docker logs` still shows all of it.
;
; A program that exits is started again. One that dies within startsecs of
; starting counts as a failed start; supervisord waits a second longer before
; each retry and gives up after startretries, leaving it FATAL rather than
; spinning — `docker exec <container> supervisorctl status` shows which.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; -F: in the foreground, where supervisord can see it. It manages its own pool
; of PHP workers underneath.
[program:php-fpm]
command=php-fpm -F
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files = /etc/supervisor.d/*.ini
