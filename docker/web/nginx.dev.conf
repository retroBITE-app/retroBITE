server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php index.html;

    client_max_body_size 64M;

    # 'unsafe-eval' is required by Alpine — see docker/web/nginx.conf.
    #
    # Dev-only relaxation of docker/web/nginx.conf. Assets come from the Vite dev
    # server on another port, which `script-src 'self'` alone blocks — the page then
    # renders unstyled with no error but a console CSP violation.
    # Localhost origins only, so this stays useless to anything off the machine.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' http://localhost:* http://127.0.0.1:*; script-src 'self' 'unsafe-eval' http://localhost:* http://127.0.0.1:*; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:*; font-src 'self' data: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Laravel routing — pass all non-file requests through index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Hashing one game reads the whole file. A single 60 GB ISO outlasts the
        # 60s default, and the batch that holds it would 504 mid-digest.
        fastcgi_read_timeout 600;
    }

    # Deny hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
