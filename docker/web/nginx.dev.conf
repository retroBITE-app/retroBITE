server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php index.html;

    client_max_body_size 256M;

    # 'unsafe-eval' is required by Alpine — see docker/web/nginx.conf.
    #
    # Dev-only relaxation of docker/web/nginx.conf. Assets come from the Vite dev
    # server on another port, which `script-src 'self'` alone blocks — the page then
    # renders unstyled with no error but a console CSP violation.
    # Localhost origins only, so this stays useless to anything off the machine.
    #
    # 'unsafe-inline' in script-src is for Laravel Debugbar, which starts itself
    # from an inline script carrying that request's data: no hash can match it,
    # and a nonce would need the header written per request rather than here.
    # Without it the bar is blocked silently. Production's nginx.conf does not
    # have it, and does not ship the debug bar either.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' http://localhost:* http://127.0.0.1:* http://*:1337; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* http://127.0.0.1:* http://*:1337; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* http://*:1337; font-src 'self' data: http://localhost:* http://127.0.0.1:* http://*:1337; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Live updates: the websocket to Reverb, which listens on 127.0.0.1:8080
    # inside this container. ^~ and the trailing slash are both load-bearing:
    # /app/{key} is the socket, while a bare /app prefix would also swallow
    # /apple-touch-icon.png and Reverb's publishing API under /apps/, which
    # must never be reachable from the network. Plain http upstream; the page's
    # own scheme decides ws or wss in front.
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Files Laravel has decided may be served, handed back to nginx with
    # X-Accel-Redirect so the bytes go by sendfile instead of through a PHP
    # worker (ServeGameFileController, ServeMediaController). internal: never
    # reachable by a URL typed or linked, only by that header. ^~ so the
    # hidden-file rule below cannot refuse a ROM whose name starts with a dot.
    location ^~ /_serve/games/ {
        internal;
        alias /app/storage/app/games/;
        types {}
        default_type application/octet-stream;
    }

    location ^~ /_serve/media/ {
        internal;
        alias /app/storage/app/media/;
    }

    # The app manifest, under the type it is specified with: nginx's mime.types
    # has no entry for .webmanifest and would send it as octet-stream.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # The service worker is revalidated on every visit. `expires` rather than
    # add_header: an add_header here would drop every security header above.
    location = /sw.js {
        expires -1;
    }

    # Laravel routing — pass all non-file requests through index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Hashing one game reads the whole file. A single 60 GB ISO outlasts the
        # 60s default, and the batch that holds it would 504 mid-digest.
        fastcgi_read_timeout 600;
    }

    # Deny hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
