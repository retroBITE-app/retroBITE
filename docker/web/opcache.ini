; Opcache is off by default in the official PHP images. For a long-lived FPM
; container serving the same files for its whole life it is a large free win.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; The app code never changes inside a running container — a new build means a
; new image. Skipping the stat() on every include is worth real latency.
opcache.validate_timestamps=0
