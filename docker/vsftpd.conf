# vsftpd configuration for retro gaming consoles
listen=YES
listen_ipv6=NO

# Disable anonymous FTP access - require authentication
anonymous_enable=NO

# Allow local users only
local_enable=YES
write_enable=YES
local_umask=022

# Drop every session straight into the library and keep it there. Consoles
# expect to browse from the games root, and an authenticated client has no
# business reading the rest of the container.
local_root=/games
chroot_local_user=YES

# Passive mode settings (required for most consoles)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=
pasv_addr_resolve=NO

# Performance settings
xferlog_enable=YES
connect_from_port_20=YES

# Security settings (relaxed for retro consoles)
seccomp_sandbox=NO
allow_writeable_chroot=YES

# Banner
ftpd_banner=Welcome to RetroBITE

# Timeouts
idle_session_timeout=600
data_connection_timeout=120

# Enable logging
xferlog_file=/var/log/vsftpd.log
log_ftp_protocol=YES
