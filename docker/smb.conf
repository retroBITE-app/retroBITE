[global]
   workgroup = WORKGROUP
   server string = retroBite
   security = user
   map to guest = Never
   log file = /var/log/samba/%m.log
   max log size = 50
   
   server min protocol = NT1
   client min protocol = NT1
   lanman auth = yes
   ntlm auth = yes
   
   # Performance optimizations
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
   read raw = yes
   write raw = yes
   max xmit = 65535
   dead time = 15
   getwd cache = yes
   
[games]
   comment = retroBite Library
   path = /games
   browseable = yes
   writable = yes
   guest ok = no
   valid users = @users
   read only = no
   create mask = 0775
   directory mask = 0775
   
   # SMBv1 specific options for maximum compatibility
   min protocol = NT1
   max protocol = SMB3

# Per-console shares are generated at boot by docker/entrypoint.sh from
# SMB_SHARES, so the console list lives in exactly one place. The file is
# rewritten on every start; an empty one is valid.
include = /etc/samba/shares.conf
